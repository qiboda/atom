[workspace]
members = [
    "crates/atom_terrain",
]
resolver = "3"

[workspace.package]
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19", features = [
    "file_watcher",
    "embedded_watcher",
    "trace",
    "trace_tracy",
    "serialize",
    "bevy_remote",
    "bevy_camera_controller",
    "free_camera",
] }
log = { version = "0.4", features = ["max_level_info"] }
tracing = { version = "0.1", features = ["max_level_info"] }
bytemuck = { version = "1.24" }
crossbeam = { version = "0.8" }

[patch.crates-io]
bevy = { path = "/data/codes/Bevy" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
collapsible_if = "allow"
unwrap_used = "warn"
panic = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1
