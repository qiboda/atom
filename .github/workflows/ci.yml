name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  # Bevy 0.19 需要 nightly + cfg_select feature（本地 Bevy 有 3 处手动补丁，见 scripts/bevy-0.19.patch）
  RUST_TOOLCHAIN: nightly-2026-01-22

jobs:
  rust:
    name: Rust (fmt + build + clippy + docs + nextest + bevy_lint + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: ${{ github.job }}
      # .cargo/config.toml 硬编码 -fuse-ld=/usr/bin/mold（本地加速标配），runner 需装 mold
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      # Bevy 0.19 音频/输入系统依赖（alsa-sys 需 libasound2-dev，libudev-sys 需 libudev-dev）
      - name: Install Bevy system deps
        run: sudo apt-get install -y libasound2-dev libudev-dev
      # Bevy 0.19 以 path patch 依赖本地源码（Cargo.toml [patch.crates-io]）。
      # runner 上必须复现本地环境：clone v0.19.0 到 /data/codes/Bevy + 应用补丁。
      # 补丁内容 = 本地 /data/codes/Bevy 的 3 处手动修改（cfg_select feature + import 排序）。
      - name: Setup Bevy source (clone v0.19.0 + patch)
        run: |
          sudo mkdir -p /data/codes
          sudo chown -R runner:docker /data/codes
          git clone --depth 1 --branch v0.19.0 https://github.com/bevyengine/bevy.git /data/codes/Bevy
          cd /data/codes/Bevy
          git apply "$GITHUB_WORKSPACE/scripts/bevy-0.19.patch"
      - run: cargo fmt --check
      - run: cargo build --verbose
      - run: cargo clippy --workspace -- -A dead_code -D warnings
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: taiki-e/install-action@nextest
      - name: Run tests (nextest)
        run: cargo nextest run --workspace
      - name: Install bevy_lint
        # bevy_lint 0.6.0 不在 crates.io，需从 TheBevyFlock/bevy_cli git tag 安装
        run: cargo install bevy_lint --git https://github.com/TheBevyFlock/bevy_cli.git --tag lint-v0.6.0 --locked
      - name: Run bevy_lint
        run: bevy_lint
      - uses: taiki-e/install-action@cargo-deny
      - name: Run cargo deny
        run: cargo deny check
      # 覆盖率硬门槛放最后：即使不达标（当前基线 27.54%），前面的门禁仍全部执行完、结果可见。
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check coverage (fail below 80%)
        run: cargo llvm-cov nextest --workspace --release --fail-under-lines 80

  bench-check:
    name: Bench (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: ${{ github.job }}
      # .cargo/config.toml 硬编码 -fuse-ld=/usr/bin/mold，runner 需装 mold
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      # Bevy 0.19 音频/输入系统依赖（alsa-sys 需 libasound2-dev，libudev-sys 需 libudev-dev）
      - name: Install Bevy system deps
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - name: Setup Bevy source (clone v0.19.0 + patch)
        run: |
          sudo mkdir -p /data/codes
          sudo chown -R runner:docker /data/codes
          git clone --depth 1 --branch v0.19.0 https://github.com/bevyengine/bevy.git /data/codes/Bevy
          cd /data/codes/Bevy
          git apply "$GITHUB_WORKSPACE/scripts/bevy-0.19.patch"
      - run: cargo bench --no-run
